spring.application.name=backend
server.port=8080

# MongoDB Configuration (supports local and MongoDB Atlas via MONGODB_URI environment variable)
# Example Atlas URI: mongodb+srv://<username>:<password>@cluster0.abcde.mongodb.net/interview_platform?retryWrites=true&w=majority
spring.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/interview_platform}

spring.data.mongodb.auto-index-creation=true

jwt.secret=${JWT_SECRET:InterviewPlatformSuperSecretKeyForJWTAuthentication2026SecureKeyWithAtLeast256BitsLongForHmacSha256Security}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173}

gemini.api.key=${GEMINI_API_KEY:}
gemini.model=${GEMINI_MODEL:gemini-2.0-flash}
ai.service.url=${AI_SERVICE_URL:http://localhost:8000}

spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=15MB

spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
mail.from-address=${MAIL_FROM:noreply@aiinterviewprep.com}
mail.enabled=${MAIL_ENABLED:false}