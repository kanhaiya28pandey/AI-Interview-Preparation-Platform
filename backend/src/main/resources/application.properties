spring.application.name=backend
server.port=8080

# MongoDB Configuration (supports local and MongoDB Atlas via MONGODB_URI environment variable)
# Example Atlas URI: mongodb+srv://<username>:<password>@cluster0.abcde.mongodb.net/interview_platform?retryWrites=true&w=majority
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/interview_platform}
spring.data.mongodb.auto-index-creation=true

# JWT Configuration
jwt.secret=${JWT_SECRET:InterviewPlatformSuperSecretKeyForJWTAuthentication2026SecureKeyWithAtLeast256BitsLongForHmacSha256Security}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# CORS Configuration
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173}

# Gemini AI Service Configuration
gemini.api.key=${GEMINI_API_KEY:}
gemini.model=${GEMINI_MODEL:gemini-2.0-flash}

# File Upload Multipart Configuration
spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=15MB